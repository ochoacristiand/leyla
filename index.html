<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="¡Feliz cumpleaños, Martín y Pablo! Descarguen a Leyla, la asistente.">
<meta property="og:title" content="¡Feliz cumpleaños, Martín y Pablo!">
<meta property="og:description" content="Si quieres mejorar tu rutina, descárgame en tu computadora e instálame.">
<meta property="og:image" content="leyla.png">
<link rel="icon" type="image/png" href="leyla.png">
<title>Leyla de regalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  :root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
  /* Una sola pantalla en negro: saludo, Leyla flotando y la descarga, centrados en columna. */
  :root {
    --bg: #000000;
    --fg: #f5f3f0;
    --muted: #8f8a86;
    --line: rgba(245, 243, 240, .55);
    --glow: rgba(91, 162, 217, .22);
    --font: 'DM Sans', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    --pill: 60px;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    letter-spacing: -.02em;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 40px);
    padding-block: clamp(32px, 8vh, 72px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -.045em;
    text-wrap: balance;
  }
  h1 span { display: inline-block; }
  .saludo { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.6vh, 14px); }
  .nombres {
    margin: 0;
    font-weight: 300;
    font-size: clamp(1.6rem, 4.4vw, 2.8rem);
    line-height: 1.1;
    letter-spacing: -.035em;
    color: var(--muted);
  }

  /* Leyla: el loop de reposo del avatar (WebM con transparencia) sobre un halo azul muy suave. */
  .leyla {
    position: relative;
    width: clamp(190px, 34vw, 280px);
    max-width: 100%;
    aspect-ratio: 1;
  }
  .leyla::before {
    content: "";
    position: absolute;
    inset: 12% 8% 4%;
    border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow), transparent 75%);
    filter: blur(8px);
  }
  .leyla video, .leyla img {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
  }

  .mensaje { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 30ch; }
  .mensaje p { margin: 0; }
  .principal {
    font-size: clamp(1.15rem, 2.6vw, 1.45rem);
    line-height: 1.35;
    font-weight: 400;
    text-wrap: balance;
  }
  .nota { font-size: .95rem; color: var(--muted); }

  /* Botón con el estilo de la plataforma: píldora, mayúsculas chicas con aire. */
  .descarga { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .boton {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 28px;
    border-radius: var(--pill);
    border: 1.5px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    font: 600 .85rem/1 var(--font);
    letter-spacing: .06em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .2s, color .2s;
  }
  .boton svg { width: 18px; height: 18px; flex: none; }
  .boton:hover { background: var(--fg); color: var(--bg); }
  .boton:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
  .requisitos { font-size: .8rem; color: var(--muted); letter-spacing: 0; }

  @media (prefers-reduced-motion: reduce) {
    .boton { transition: none; }
  }
</style>

</head>
<body>
<main>
  <header class="saludo">
    <h1><span>¡Hola!</span> <span>¡Feliz cumpleaños!</span></h1>
    <p class="nombres">Martín y Pablo</p>
  </header>

  <div class="leyla">
    <video id="leyla" src="leyla.webm" poster="leyla.png" autoplay loop muted playsinline aria-label="Leyla, la asistente, flotando"></video>
  </div>

  <div class="mensaje">
    <p class="principal">Si quieres mejorar tu rutina, descárgame en tu computadora e instálame.</p>
    <p class="nota">(solo requiere un poco de paciencia)</p>
  </div>

  <div class="descarga">
    <a class="boton" href="https://drive.google.com/uc?export=download&amp;id=1uHZMU9ZTd7QOSYAE6Oue4_z0-gh8Z8zf" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>
      Descargar Leyla
    </a>
    <span class="requisitos">Para Windows 10 y 11 · 173 MB</span>
  </div>
</main>

<script>
  // Con movimiento reducido, Leyla queda quieta (se ve el primer cuadro).
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const v = document.getElementById('leyla');
      v.removeAttribute('autoplay');
      v.pause();
    }
  } catch (e) {}
</script>

</body>
</html>
